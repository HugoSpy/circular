name: circular
services:
  app:
    image: circular:${CIRCULAR_IMAGE_TAG:-2.0.0}
    build: .
    init: true
    restart: unless-stopped
    ports:
      - "${CIRCULAR_BIND_ADDRESS:-127.0.0.1}:${CIRCULAR_HTTP_PORT:-4310}:4310"
    environment:
      CIRCULAR_ENV: production
      CIRCULAR_PUBLIC_URL: ${CIRCULAR_PUBLIC_URL:?Set CIRCULAR_PUBLIC_URL to the HTTPS origin}
      CIRCULAR_DATABASE_URL_FILE: /run/secrets/database_url
      CIRCULAR_TRUSTED_PROXIES: ${CIRCULAR_TRUSTED_PROXIES:-127.0.0.1}
    secrets:
      - database_url
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    cpus: 2
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
secrets:
  database_url:
    file: ${CIRCULAR_SECRETS_DIR:-./secrets}/database_url
