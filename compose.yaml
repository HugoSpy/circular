name: circular
services:
  app:
    image: circular:${CIRCULAR_IMAGE_TAG:-2.1.0}
    build: .
    init: true
    restart: unless-stopped
    ports:
      - "${CIRCULAR_BIND_ADDRESS:-127.0.0.1}:${CIRCULAR_HTTP_PORT:-4310}:4310"
    environment:
      CIRCULAR_ENV: production
      CIRCULAR_PUBLIC_URL: ${CIRCULAR_PUBLIC_URL:?Set CIRCULAR_PUBLIC_URL to the HTTPS origin}
      CIRCULAR_MCP_REDIRECT_URIS: ${CIRCULAR_MCP_REDIRECT_URIS:-}
      CIRCULAR_DATABASE_URL_FILE: /run/secrets/database_url
      CIRCULAR_SMTP_HOST: ${CIRCULAR_SMTP_HOST:?Set CIRCULAR_SMTP_HOST for email verification}
      CIRCULAR_SMTP_PORT: ${CIRCULAR_SMTP_PORT:-587}
      CIRCULAR_SMTP_USERNAME: ${CIRCULAR_SMTP_USERNAME:?Set CIRCULAR_SMTP_USERNAME for email verification}
      CIRCULAR_SMTP_PASSWORD_FILE: /run/secrets/smtp_password
      CIRCULAR_EMAIL_FROM: ${CIRCULAR_EMAIL_FROM:?Set CIRCULAR_EMAIL_FROM for email verification}
      CIRCULAR_TRUSTED_PROXIES: ${CIRCULAR_TRUSTED_PROXIES:-127.0.0.1}
    secrets:
      - database_url
      - smtp_password
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    cpus: 2
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
secrets:
  database_url:
    file: ${CIRCULAR_SECRETS_DIR:-./secrets}/database_url
  smtp_password:
    file: ${CIRCULAR_SECRETS_DIR:-./secrets}/smtp_password
