# Template for the school's existing HTTPS reverse proxy. Do not install as-is:
# replace the DNS name and certificate paths with the school's approved values.
server {
    listen 80;
    server_name circular.example.epita.fr;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name circular.example.epita.fr;
    ssl_certificate /etc/nginx/certificates/circular/fullchain.pem;
    ssl_certificate_key /etc/nginx/certificates/circular/private.key;
    client_max_body_size 128k;

    location / {
        proxy_pass http://127.0.0.1:4310;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # This example assumes this Nginx is the trusted edge. Replace, do not
        # append untrusted client forwarding headers.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }
}
